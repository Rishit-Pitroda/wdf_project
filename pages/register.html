<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Register</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js"></script>
</head>

<body>
    <header>
        <div class="logo">
            <h1>🎓 Student Portal</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html" class="active">Register</a></li>
                <li><a href="login.html">Login</a></li>
                <li class="dropdown">
                    <a href="dashboard.html">Dashboard <span class="dropdown-arrow">▼</span></a>
                    <ul class="dropdown-content">
                        <li><a href="profile.html">Profile</a></li>
                        <li><a href="courses.html">Courses</a></li>
                        <li><a href="attendance.html">Attendance</a></li>
                        <li><a href="assignment.html">Assignment</a></li>
                        <li><a href="result.html">Result</a></li>
                        <li><a href="faculties.html">Faculties</a></li>
                    </ul>
                </li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-section">
            <h2>Register</h2>
            <p>Create your student account</p>

            <div class="form-container">
                <form>
                    <div class="form-group">
                        <label for="fullname">Full Name *</label>
                        <input type="text" id="fullname" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="student-id">Student ID *</label>
                        <input type="text" id="student-id" placeholder="Enter student ID" required>
                    </div>

                    <div class="form-group">
                        <label for="course">Course *</label>
                        <select id="course" required>
                            <option value="">Select your course</option>
                            <option value="cs">Computer Science</option>
                            <option value="it">Information Technology</option>
                            <option value="se">Software Engineering</option>
                            <option value="ds">Data Science</option>
                            <option value="cyber">Cybersecurity</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="year">Year of Study *</label>
                        <select id="year" required>
                            <option value="">Select year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password *</label>
                        <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the Terms and Conditions</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Register</button>
                </form>

                <div class="form-footer">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Portal. All rights reserved.</p>
    </footer>
</body>

</html>
